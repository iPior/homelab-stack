global:
  scrape_interval: 30s

storage:
  tsdb:
    retention:
      time: 15d
      size: 2GB

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: node-exporter
    static_configs:
      - targets: [host.docker.internal:9100]
        labels:
          instance: media-server
      - targets: [192.168.100.10:9100]
        labels:
          instance: devbox
      - targets: [100.75.212.97:9100]
        labels:
          instance: optiplex

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels:
          instance: media-server
      - targets: [100.75.212.97:9280]
        labels:
          instance: optiplex
